schemaVersion = 1
project {
  id = "vertical-spike"
  artifactDirectory = "./artifacts"
  snapshotDirectory = "./snapshots"
}
runtime {
  tickRate = 20
  limits {
    defaultMaxTicks = 2000
    defaultMaxWallTime = 10s
    eventBufferSize = 16
  }
}
computers {
  main {
    caseTier = 3
    hardware {
      cpu = { tier = 3 }
      memory = [{ tier = 3 }, { tier = 3.5 }]
      gpu = { tier = 3 }
      eeprom = { builtin = "lua-bios" }
      disks {
        project {
          kind = "hdd"
          tier = 3
          label = "project"
          source = "."
          access = "read-write"
        }
      }
      cards = []
    }
  }
}
screens {
  main {
    tier = 3
    keyboard = true
    aspectRatio = [1, 1]
  }
}
connections = [{ from = "computer:main", to = "screen:main" }]
