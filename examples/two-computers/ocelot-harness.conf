schemaVersion = 1
project { id = "two-computers" }
runtime {
  limits {
    defaultMaxTicks = 2000
    defaultMaxWallTime = 10s
    eventBufferSize = 128
  }
}
computers {
  alpha {
    caseTier = 3
    hardware {
      cpu = { tier = 3 }
      memory = [{ tier = 3 }, { tier = 3.5 }]
      gpu = { tier = 3 }
      eeprom = { builtin = "lua-bios" }
      disks.project = {
        kind = "hdd", tier = 3, label = "alpha"
        source = "./alpha", access = "read-write"
      }
      cards = [{ kind = "network", tier = 1 }]
    }
  }
  beta {
    caseTier = 2
    hardware {
      cpu = { tier = 2 }
      memory = [{ tier = 2 }, { tier = 2.5 }]
      gpu = { tier = 2 }
      eeprom = { builtin = "lua-bios" }
      disks.project = {
        kind = "hdd", tier = 2, label = "beta"
        source = "./beta", access = "read-only"
      }
      cards = [{ kind = "network", tier = 1 }]
    }
  }
}
screens {
  alpha { tier = 3, keyboard = true }
  beta { tier = 2, keyboard = true }
}
connections = [
  { from = "computer:alpha", to = "screen:alpha" },
  { from = "computer:beta", to = "screen:beta" }
]
