schemaVersion = 2
project { id = "showcase" }
workspace { kind = "manifest" }
runtime {
  tickRate = 20
  clock { autoStart = true }
  internet { http = false, tcp = false }
}
devices {
  main {
    kind = "computer", tier = 3
    inventory = [
      { slot = "gpu", kind = "gpu", tier = 3 },
      { slot = "card-1", kind = "network", tier = 1 },
      { slot = "memory-1", kind = "memory", tier = 3.5 },
      { slot = "disk-1", kind = "managed-hdd", tier = 3, id = "project", label = "main", source = "./computer", access = "read-write" },
      { slot = "cpu", kind = "cpu", tier = 3 },
      { slot = "eeprom", kind = "eeprom", builtin = "lua-bios" }
    ]
  }
  main-screen { kind = "screen", tier = 3, keyboard = true }

}
connections = [
  { from = "main:network", to = "main-screen:network" }
]
